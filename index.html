<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Heart Curve</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      width: 90vmin;
      height: 90vmin;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const size = 600;
    canvas.width = size;
    canvas.height = size;

    ctx.translate(size / 2, size / 2);
    ctx.scale(1, -1);

    let t = 0;

    function heart(t) {
      return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y:
          13 * Math.cos(t) -
          5 * Math.cos(2 * t) -
          2 * Math.cos(3 * t) -
          Math.cos(4 * t),
      };
    }

    function draw() {
      ctx.clearRect(-size / 2, -size / 2, size, size);
      ctx.beginPath();

      for (let i = 0; i < t; i += 0.01) {
        const p = heart(i);
        const x = p.x * 12;
        const y = p.y * 12;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      const gradient = ctx.createLinearGradient(-200, 0, 200, 0);
      gradient.addColorStop(0, "#ff4d4d");
      gradient.addColorStop(1, "#ff99cc");

      ctx.strokeStyle = gradient;
      ctx.lineWidth = 4;
      ctx.stroke();

      t += 0.05;
      if (t > Math.PI * 2) t = 0;

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>

</html>
