<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>心动数学 - to 静静</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
html,body{
  margin:0; padding:0; height:100%;
  background:#0b0d12;
  overflow:hidden;
  font-family:"Helvetica Neue","PingFang SC",sans-serif;
  color: rgba(255,255,255,0.95);
}
canvas{position:absolute; inset:0; display:block;}
.text{
  position:absolute;
  bottom:10%;
  width:100%;
  text-align:center;
  line-height:1.6;
  font-size:calc(12px + 0.5vw);
  letter-spacing:0.08em;
  opacity:1;  
  pointer-events:none;
}
.line{
  display:block;
  transform: translateY(0);
  text-shadow: 0 0 12px rgba(255,255,255,0.35);
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="text" class="text">
  <div class="line">在无穷的小数点里</div>
  <div class="line">有些曲线悄悄蜿蜒</div>
  <div class="line">不为求解，只为呼吸</div>
  <div class="line">像轻轻靠近的极限</div>
  <div class="line">若你正好懂得它的节奏</div>
  <div class="line">那一定不是巧合</div>
  <div class="line">每一个点，每一次光晕</div>
  <div class="line">都是给你的 — to 静静</div>
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let w,h;
resize();
window.addEventListener("resize",resize);
function resize(){ w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight; }

const center={x:w/2,y:h/2};
const scale=Math.min(w,h)/40;
const COUNT=1200;
let particles=[];

// 心形函数
function heart(t){ return {x:16*Math.pow(Math.sin(t),3),y:13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)} }

// 初始化粒子
for(let i=0;i<COUNT;i++){
  const t = Math.random()*Math.PI*2;
  const p = heart(t);
  particles.push({
    x: center.x + p.x*scale + (Math.random()-0.5)*20,
    y: center.y - p.y*scale + (Math.random()-0.5)*20,
    tx: center.x + p.x*scale,
    ty: center.y - p.y*scale,
    radius:1+Math.random()*2,
    angle: Math.random()*Math.PI*2,
    speed:0.01+Math.random()*0.02
  });
}

// 粒子颜色渐变
function colorGradient(i,frame){
  const r=255;
  const g=Math.floor(120+80*Math.sin(i/30 + frame/50));
  const b=Math.floor(150+80*Math.cos(i/40 + frame/50));
  return `rgba(${r},${g},${b},0.9)`;
}

let frame=0;

// 文字漂浮微光
const lines=document.querySelectorAll(".line");
function animateText(){
  lines.forEach((line,i)=>{
    const yOffset = Math.sin((frame/60)+i)*3;
    const glow = 0.35 + 0.2*Math.sin((frame/30)+i);
    line.style.transform = `translateY(${yOffset}px)`;
    line.style.textShadow = `0 0 14px rgba(255,255,255,${glow})`; 
  });
}

// 背景星星
const stars=[];
for(let i=0;i<300;i++){
  stars.push({x:Math.random()*w,y:Math.random()*h,r:0.5+Math.random()*1.5});
}

function animate(){
  ctx.clearRect(0,0,w,h);
  frame++;

  // 绘制星星
  stars.forEach(s=>{
    const alpha = 0.2 + 0.3*Math.sin(frame/50 + Math.random()*2);
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${alpha})`;
    ctx.fill();
  });

  // 绘制粒子
  particles.forEach((p,i)=>{
    // 简单弹性移动到目标
    p.x += (p.tx - p.x)*0.02;
    p.y += (p.ty - p.y)*0.02;

    const orbitX = Math.cos(p.angle+frame*p.speed)*2;
    const orbitY = Math.sin(p.angle+frame*p.speed)*2;

    const rx = p.x + orbitX;
    const ry = p.y + orbitY;

    ctx.beginPath();
    ctx.arc(rx,ry,p.radius,0,Math.PI*2);
    ctx.fillStyle=colorGradient(i,frame);
    ctx.fill();
  });

  animateText();

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
